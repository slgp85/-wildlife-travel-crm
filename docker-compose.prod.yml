# Production stack: Caddy (HTTPS) -> frontend + backend -> Postgres.
# Only Caddy publishes ports; the database and API are not exposed directly.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      CORS_ORIGINS: '["https://${DOMAIN}"]'
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-false}
    depends_on:
      db:
        condition: service_healthy
    ports:
      # Loopback only: for a host reverse proxy (e.g. nginx) when Caddy is not used.
      - "127.0.0.1:8100:8000"

  frontend:
    build:
      context: ./frontend
      args:
        # Empty = same origin: the browser calls /api/v1 on the site's own domain.
        VITE_API_URL: ""
    restart: unless-stopped
    ports:
      - "127.0.0.1:8101:80"

  # Optional HTTPS front door. Enable with: docker compose --profile caddy up -d
  # Skip it when another web server already owns ports 80/443.
  caddy:
    profiles: ["caddy"]
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend

# Without Caddy, proxy `/api/` -> 127.0.0.1:8100 and `/` -> 127.0.0.1:8101 from the host web server.

volumes:
  pgdata:
  caddy_data:
  caddy_config:
